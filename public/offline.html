<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <title>Offline · Loft</title>
        <style>
            :root {
                --paper: #f2ead9;
                --ink: #1d2238;
                --muted: #6b6a72;
                --accent: #d8392b;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --paper: #f2ead9;
                    --ink: #1d2238;
                    --muted: #6b6a72;
                    --accent: #d8392b;
                }
            }
            body {
                margin: 0;
                font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
                background: var(--paper);
                color: var(--ink);
                min-height: 100dvh;
                display: flex;
                align-items: center;
                padding: 0 28px;
                box-sizing: border-box;
                -webkit-font-smoothing: antialiased;
            }
            .card {
                max-width: 440px;
            }
            h1 {
                margin: 0;
                font-size: clamp(1.75rem, 8vw, 2.5rem);
                font-style: italic;
                font-weight: 500;
                line-height: 1.05;
                letter-spacing: 0;
            }
            p {
                margin: 16px 0 0;
                color: var(--muted);
                font-size: 1.0625rem;
                line-height: 1.5;
            }
            a.retry {
                display: inline-block;
                margin-top: 16px;
                padding: 12px 0;
                color: var(--accent);
                font-weight: 650;
                text-decoration: none;
            }
            a.retry:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Grounded.</h1>
            <p>You're offline and this page wasn't saved yet. The valley flies offline once you have opened it. Reconnect to load this page.</p>
            <a class="retry" href="catalyst://retry">Try again</a>
        </div>
    </body>
</html>
