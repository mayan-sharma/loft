<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Loft</title>
<style>
  /* --ink must equal WEBVIEW_CONFIG.splashScreen.backgroundColor. The native build injects it as
     window.__CATALYST_SPLASH__; this value is the fallback for a page opened on its own. */
  :root {
    --ink: #2f4678;
    --t0: 420ms;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --launch: cubic-bezier(0.4, 0, 0.9, 0.5);
  }
  /* Transparent until placed: the identical native image (public/android|ios/splashscreen.png, 144px) shows
     through, so the handoff is invisible. Frame 0 here is that image. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .ready, .ready body { background: var(--ink); }
  #mark { position: fixed; width: 144px; height: 144px; margin: -72px 0 0 -72px; visibility: hidden; }
  .ready #mark { visibility: visible; }
  html:not(.go) * { animation-play-state: paused !important; }
  /* The seal is pressed, lifts a little, and the name is written under it */
  #mark svg { display: block; animation: press 900ms var(--ease) calc(var(--t0) + 0ms) both; }
  @keyframes press { 0% { transform: none; } 30% { transform: scale(0.94); } 100% { transform: translateY(-34px) scale(0.6); } }

  #word { position: fixed; left: 0; right: 0; text-align: center; visibility: hidden; color: #fbf3e2;
    font: italic 500 54px/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  #word small { display: block; margin-top: 12px; font-size: 16px; }
  .ready #word { visibility: visible; }
  #word { animation: rise 900ms var(--ease) calc(var(--t0) + 500ms) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  @media (prefers-reduced-motion: reduce) { .tile { animation: none !important; } #word { animation-duration: 1ms; } }
</style>
</head>
<body>
<div id="mark"><svg viewBox="0 0 48 48" width="144" height="144"><rect x="3" y="3" width="42" height="42" rx="5" fill="#d8392b"/><path d="M11 25.5 37 12 29.5 37l-6.2-8.6Zm12.3 2.9L37 12 20.8 26.6l-.6 7.4Z" fill="#f8f2e4" fill-rule="evenodd"/></svg></div>
<div id="word">Loft<small>A paper plane, a valley, one long day</small></div>
<script>
(function () {
  var cfg = window.__CATALYST_SPLASH__;
  if (cfg && cfg.backgroundColor) document.documentElement.style.setProperty('--ink', cfg.backgroundColor);
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(probe);
  function insets() { var cs = getComputedStyle(probe); return [parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingBottom) || 0]; }
  function start() {
    var DPR = window.devicePixelRatio || 1;
    var ins = IOS ? insets() : [0, 0];
    /* Centre exactly where the native image sits, snapped to device pixels */
    var ox = Math.round(window.innerWidth / 2 * DPR) / DPR;
    var oy = Math.round((window.innerHeight + ins[0] - ins[1]) / 2 * DPR) / DPR;
    var mark = document.getElementById('mark');
    mark.style.left = ox + 'px'; mark.style.top = oy + 'px';
    document.getElementById('word').style.top = oy + 34 + 'px';
    var html = document.documentElement;
    /* Android keeps the WebView at alpha 0 until onPageFinished, so hold frame 0 a little longer there */
    html.style.setProperty('--t0', IOS ? '160ms' : '420ms');
    html.classList.add('ready');
    requestAnimationFrame(function () { requestAnimationFrame(function () { html.classList.add('go'); }); });
  }
  if (!IOS) { if (document.readyState === 'complete') start(); else window.addEventListener('load', start); return; }
  var since = Date.now();
  (function wait() { if (insets()[0] > 0 || Date.now() - since > 900) start(); else setTimeout(wait, 16); })();
})();
</script>
</body>
</html>
